name: Build Installers
on:
    workflow_dispatch:

env:
    FORCE_COLOR: true

jobs:
    Build:
        name: Build installer (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      asset: OnlycordInstaller
                    # ubuntu-22.04 keeps the Linux build compatible with older distros
                    - os: ubuntu-22.04
                      asset: OnlycordInstaller-Linux

        steps:
            - uses: actions/checkout@v7

            - name: Setup PNPM
              uses: pnpm/setup@v2.1.0
              with:
                  runtime: node@v24
                  require-lockfile: true

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Tk and a virtual display
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libtk8.6 xvfb

            - name: Install PyInstaller
              run: python -m pip install pyinstaller==6.16.0 pillow==11.1.0

            - name: Build Onlycord
              run: pnpm buildStandalone

            - name: Package installer
              run: >-
                  python -m PyInstaller --onefile --windowed --name ${{ matrix.asset }}
                  --icon installer/image.png
                  --add-data installer/image.png:.
                  --add-data dist/desktop:onlycord
                  --distpath release --workpath installer/.build
                  installer/OnlycordInstaller.pyw

            - name: Test installer on a fake Discord
              if: runner.os == 'Linux'
              run: |
                  installer="$PWD/release/${{ matrix.asset }}"
                  export XDG_CONFIG_HOME="$RUNNER_TEMP/config"
                  resources="$RUNNER_TEMP/resources"
                  mkdir -p "$resources"
                  echo original > "$resources/app.asar"

                  "$installer" --patch "$resources"
                  test "$(cat "$resources/_app.asar")" = original
                  grep -aq "$XDG_CONFIG_HOME/Onlycord/dist" "$resources/app.asar"
                  test -f "$XDG_CONFIG_HOME/Onlycord/dist/patcher.js"

                  "$installer" --unpatch "$resources"
                  test "$(cat "$resources/app.asar")" = original
                  test ! -e "$resources/_app.asar"

                  # The window stays open until it's closed, so a timeout means it started fine
                  timeout 15 xvfb-run -a "$installer" || test $? -eq 124

            - name: Upload installer
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.asset }}
                  path: release/*
